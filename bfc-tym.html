<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tým pořadatelů - BFC Brno Florball Cup</title>
    <link rel="icon" type="image/png" href="images/BFC/BFC-Logo2.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bfcRed: '#E31B23', bfcDark: '#121316', bfcCard: '#1C1E22', bfcBorder: '#2E3238' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bfcDark text-gray-100 min-h-screen flex flex-col">
    <!-- Hlavička -->
    <header class="sticky top-0 z-50 bg-bfcDark/95 border-b border-bfcBorder">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-bfcRed/10 border border-bfcRed/30 flex items-center justify-center font-black text-bfcRed">BFC</div>
                <span class="text-xl font-black text-white">BFC <span class="text-bfcRed">Tým pořadatelů</span></span>
            </a>
            <nav class="hidden md:flex space-x-2 text-sm font-semibold">
                <a href="index.html" class="px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Hlavní strana</a>
                <a href="bfc-tym.html" class="px-3 py-2 bg-bfcRed text-white rounded-lg">Tým pořadatelů</a>
                <a href="poradatel/poradatel.html" class="px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Pořadatel</a>
            </nav>
            <button onclick="toggleMobileMenu()" class="md:hidden p-2.5 rounded-xl bg-bfcCard border border-bfcRed/40 text-white hover:bg-bfcRed/20 hover:border-bfcRed group transition duration-300">
                <i data-lucide="menu" class="w-6 h-6 text-bfcRed group-hover:rotate-90 transition duration-300"></i>
            </button>
        </div>
        <div id="mobile-menu" class="hidden md:hidden px-4 py-4 bg-bfcCard border-b border-bfcBorder space-y-2 text-sm font-semibold">
            <a href="index.html" class="block px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Hlavní strana</a>
            <a href="bfc-tym.html" class="block px-3 py-2 bg-bfcRed text-white rounded-lg">Tým pořadatelů</a>
            <a href="poradatel/poradatel.html" class="block px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Pořadatel</a>
        </div>
    </header>

    <!-- Hlavní obsah -->
    <main class="max-w-7xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="text-center max-w-2xl mx-auto mb-12 space-y-3">
            <span class="text-xs font-bold uppercase tracking-wider text-bfcRed bg-bfcRed/10 px-3 py-1 rounded-full">Lidé za turnajem</span>
            <h1 class="text-3xl md:text-4xl font-black uppercase tracking-wider text-white">Náš pořadatelský tým</h1>
            <p class="text-sm text-gray-400">Poznejte lidi, kteří se starají o bezproblémový chod turnaje Brno Florball Cup.</p>
        </div>

        <!-- Grid s pořadateli (vykresluje se dynamicky z JS) -->
        <div id="poradatele-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Sem se nahrají data -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-bfcBorder py-6 text-center text-xs text-gray-500">
        &copy; 2026 Brno Florball Cup
    </footer>

    <!-- Připojení databáze pořadatelů -->
    <script src="data/poradatele/poradatele.js"></script>

    <script>
        const grid = document.getElementById('poradatele-grid');
        
        if (window.poradateleDatabase && window.poradateleDatabase.length > 0) {
            grid.innerHTML = "";
            window.poradateleDatabase.forEach(p => {
                // Pokud má pořadatel zadanou fotku, načte se, jinak se zobrazí výchozí ikona
                const fotoHtml = p.foto 
                    ? `<img src="${p.foto}" alt="${p.jmeno}" class="w-full h-full object-cover">`
                    : `<div class="w-full h-full bg-bfcRed/10 flex items-center justify-center text-bfcRed font-black text-3xl">👤</div>`;

                // Volitelný popisek (pokud v databázi existuje)
                const popisHtml = p.popis 
                    ? `<p class="text-xs text-gray-400 mt-3 leading-relaxed">${p.popis}</p>` 
                    : '';

                grid.innerHTML += `
                    <div class="bg-bfcCard border border-bfcBorder rounded-2xl p-6 flex flex-col items-center text-center shadow-xl hover:border-bfcRed/50 transition duration-300">
                        <div class="w-24 h-24 rounded-2xl overflow-hidden border border-bfcRed/30 mb-4 shadow-md bg-bfcDark flex-shrink-0">
                            ${fotoHtml}
                        </div>
                        <h3 class="text-lg font-black text-white">${p.jmeno}</h3>
                        <span class="text-xs font-bold text-bfcRed bg-bfcRed/10 px-2.5 py-1 rounded-full mt-1.5">${p.pozice}</span>
                        ${popisHtml}
                    </div>
                `;
            });
        } else {
            grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">Zatím nejsou k dispozici žádní pořadatelé.</div>`;
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        lucide.createIcons();
    </script>
</body>
</html>

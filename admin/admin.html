<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Multiscoreboard | BFC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bfcRed: '#E31B23', bfcDark: '#121316', bfcCard: '#1C1E22', bfcBorder: '#2E3238' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bfcDark text-gray-100 min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 bg-bfcDark/95 border-b border-bfcBorder">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="../index.html" class="text-xl font-black text-white">BFC <span class="text-bfcRed">Admin</span></a>
            <nav class="space-x-2 text-sm font-semibold">
                <a href="admin.html" class="px-3 py-2 bg-bfcRed text-white rounded-lg">Multiscore</a>
                <a href="../index.html" class="px-3 py-2 text-gray-400">Hlavní web</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-6">
        <div class="flex justify-between items-center border-b border-bfcBorder pb-4">
            <h1 class="text-2xl font-black text-white">Admin - Přehled hřišť & Nastavení online</h1>
            <button onclick="alert('Nastavení uložena!')" class="px-4 py-2 bg-bfcRed text-white text-xs font-bold rounded-xl">Uložit nastavení</button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-bfcCard border border-bfcBorder p-6 rounded-2xl space-y-3">
                <div class="flex justify-between"><span class="font-bold text-white">Hřiště 1</span><span class="text-emerald-400 text-xs font-bold">LIVE</span></div>
                <div class="text-xl font-black text-white">TROOPERS vs Bulldogs</div>
                <div class="text-xs text-gray-400">Skóre: <strong class="text-bfcRed">3 : 2</strong></div>
                <a href="../poradatel/zapis.html" class="block text-center py-2 bg-bfcCardHover border border-bfcBorder text-xs font-bold rounded-xl">Ovládat hřiště</a>
            </div>
            <div class="bg-bfcCard border border-bfcBorder p-6 rounded-2xl space-y-3">
                <div class="flex justify-between"><span class="font-bold text-white">Hřiště 2</span><span class="text-emerald-400 text-xs font-bold">LIVE</span></div>
                <div class="text-xl font-black text-white">Aligators vs Vyškov</div>
                <div class="text-xs text-gray-400">Skóre: <strong class="text-bfcRed">1 : 1</strong></div>
                <a href="../poradatel/zapis.html" class="block text-center py-2 bg-bfcCardHover border border-bfcBorder text-xs font-bold rounded-xl">Ovládat hřiště</a>
            </div>
        </div>
    </main>
    <footer class="border-t border-bfcBorder py-6 text-center text-xs text-gray-500">&copy; 2026 Brno Florball Cup</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BFC Admin - Zápis utkání</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
    .scoreboard { display: flex; justify-content: space-around; align-items: center; margin: 30px 0; }
    .team { background: #222; padding: 20px; border-radius: 10px; width: 40%; }
    .score { font-size: 48px; font-weight: bold; color: #ff3333; margin: 10px 0; }
    button { background: #ff3333; color: white; border: none; padding: 15px 25px; font-size: 18px; border-radius: 5px; cursor: pointer; }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <h1>Brno Floorball Cup - Online Zápis</h1>
  <h2>Zápas #1</h2>

  <div class="scoreboard">
    <div class="team">
      <h3>FBK Bulldogs Brno</h3>
      <div id="home-score" class="score">0</div>
      <button onclick="addGoal('home')">+ GÓL DOMÁCÍ</button>
    </div>

    <div>VS</div>

    <div class="team">
      <h3>Florbal Židenice</h3>
      <div id="away-score" class="score">0</div>
      <button onclick="addGoal('away')">+ GÓL HOSTÉ</button>
    </div>
  </div>

  <script>
    let homeScore = 0;
    let awayScore = 0;

    function addGoal(team) {
      if (team === 'home') {
        homeScore++;
        document.getElementById('home-score').innerText = homeScore;
      } else {
        awayScore++;
        document.getElementById('away-score').innerText = awayScore;
      }
      
      // Tady se v budoucnu pošle požadavek na backend API pro živou aktualizaci
      console.log(`Aktuální skóre: ${homeScore}:${awayScore}`);
    }
  </script>
</body>
</html>

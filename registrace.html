<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brno Florball Cup | Registrace týmu</title>
    <link rel="icon" type="image/png" href="images/BFC/BFC-Logo2.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bfcRed: '#E31B23', bfcDark: '#121316', bfcCard: '#1C1E22', bfcBorder: '#2E3238' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bfcDark text-gray-100 min-h-screen flex flex-col">
    <!-- Hlavička -->
    <header class="sticky top-0 z-50 bg-bfcDark/95 border-b border-bfcBorder">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-bfcRed/10 border border-bfcRed/30 flex items-center justify-center font-black text-bfcRed">BFC</div>
                <span class="text-xl font-black text-white">BRNO FLORBALL <span class="text-bfcRed">CUP</span></span>
            </a>
            <!-- Menu pro počítače -->
            <nav class="hidden md:flex space-x-2 text-sm font-semibold">
                <a href="index.html" class="px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Hlavní strana</a>
                <a href="tymy.html" class="px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Týmy</a>
                <a href="kontakt.html" class="px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Kontakt</a>
                <a href="registrace.html" class="px-3 py-2 bg-bfcRed text-white rounded-lg">Registrace týmu</a>
                <a href="trener/trener.html" class="px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Trenér</a>
            </nav>

            <!-- Tlačítko hamburger menu pro mobily -->
            <button onclick="toggleMobileMenu()" class="md:hidden p-2.5 rounded-xl bg-bfcCard border border-bfcRed/40 text-white hover:bg-bfcRed/20 hover:border-bfcRed group transition duration-300">
                <i data-lucide="menu" class="w-6 h-6 text-bfcRed group-hover:rotate-90 transition duration-300"></i>
            </button>
        </div>

        <!-- Rozbalovací mobilní menu -->
        <div id="mobile-menu" class="hidden md:hidden px-4 py-4 bg-bfcCard border-b border-bfcBorder space-y-2 text-sm font-semibold">
            <a href="index.html" class="block px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Hlavní strana</a>
            <a href="tymy.html" class="block px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Týmy</a>
            <a href="kontakt.html" class="block px-3 py-2 text-gray-300 hover:bg-bfcDark rounded-lg">Kontakt</a>
            <a href="registrace.html" class="block px-3 py-2 bg-bfcRed text-white rounded-lg">Registrace týmu</a>
            <a href="trener/trener.html" class="block px-3 py-2 text-gray-300 hover:bg-bfcDark rounded-lg">Trenér</a>
        </div>
    </header>

    <!-- Hlavní obsah -->
    <main class="max-w-2xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="bg-bfcCard border border-bfcBorder rounded-3xl p-8 md:p-10 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-bfcRed to-transparent"></div>

            <div class="text-center space-y-2 mb-8">
                <div class="w-12 h-12 mx-auto rounded-2xl bg-bfcRed/10 border border-bfcRed/30 flex items-center justify-center text-bfcRed">
                    <i data-lucide="user-plus" class="w-6 h-6"></i>
                </div>
                <h1 class="text-2xl font-black text-white uppercase tracking-wider">Registrace nového týmu</h1>
                <p class="text-xs text-gray-400">Vyplňte údaje o týmu pro účast na Brno Florball Cupu</p>
            </div>

            <!-- Registrační formulář -->
            <form onsubmit="handleRegistration(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Název klubu</label>
                    <input type="text" id="reg-club" required placeholder="např. TJ Sokol Rosice" class="w-full px-4 py-3 bg-bfcDark border border-bfcBorder rounded-xl text-white text-sm focus:outline-none focus:border-bfcRed transition">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Název týmu (s rozlišením)</label>
                    <input type="text" id="reg-name" required placeholder="např. Rosice A" class="w-full px-4 py-3 bg-bfcDark border border-bfcBorder rounded-xl text-white text-sm focus:outline-none focus:border-bfcRed transition">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Kategorie</label>
                    <select id="reg-category" class="w-full px-4 py-3 bg-bfcDark border border-bfcBorder rounded-xl text-white text-sm focus:outline-none focus:border-bfcRed transition">
                        <option value="Muži">Muži</option>
                        <option value="Junioři">Junioři</option>
                        <option value="Dorostenci">Dorostenci</option>
                        <option value="Starší žáci">Starší žáci</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">Jméno trenéra</label>
                    <input type="text" id="reg-coach" required placeholder="např. Jan Novák" class="w-full px-4 py-3 bg-bfcDark border border-bfcBorder rounded-xl text-white text-sm focus:outline-none focus:border-bfcRed transition">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-300 mb-2">E-mail trenéra (pro přihlášení)</label>
                    <input type="email" id="reg-email" required placeholder="trener@klub.cz" class="w-full px-4 py-3 bg-bfcDark border border-bfcBorder rounded-xl text-white text-sm focus:outline-none focus:border-bfcRed transition">
                </div>

                <button type="submit" class="w-full py-3.5 bg-bfcRed text-white font-bold text-sm rounded-xl hover:bg-red-700 transition shadow-lg shadow-bfcRed/20 flex items-center justify-center space-x-2">
                    <span>Dokončit registraci týmu</span>
                    <i data-lucide="check" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </main>

    <footer class="border-t border-bfcBorder py-6 text-center text-xs text-gray-500">&copy; 2026 Brno Florball Cup</footer>

    <script>
        function handleRegistration(event) {
            event.preventDefault();

            const club = document.getElementById('reg-club').value;
            const name = document.getElementById('reg-name').value;
            const category = document.getElementById('reg-category').value;
            const coach = document.getElementById('reg-coach').value;
            const email = document.getElementById('reg-email').value;

            // Vygenerování unikátního ID týmu
            const teamId = name.toLowerCase().replace(/[^a-z0-9]/g, '-');

            // Vytvoření objektu nového týmu ve stejném formátu jako v bulldogs.js
            const novyTymObjekt = {
                name: name,
                club: club,
                category: category,
                coach: coach,
                logo: "images/Tymy/default.png", // Výchozí logo
                players: [] // Zpočátku bez hráčů, trenér si je doplní v profilu
            };

            // Načteme dosud registrované týmy z localStorage
            let registrovaneTymy = JSON.parse(localStorage.getItem('bfc_registrovane_tymy')) || {};
            
            // Přidáme nový tým
            registrovaneTymy[teamId] = novyTymObjekt;

            // Uložíme zpět do localStorage
            localStorage.setItem('bfc_registrovane_tymy', JSON.stringify(registrovaneTymy));

            alert(`Tým "${name}" byl úspěšně zaregistrován! Nyní se může trenér přihlásit.`);
            window.location.href = "tymy.html";
        }

        lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brno Floorball Cup (BFC) - Kompletní servis</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; }
    header { text-align: center; padding: 20px 0; border-bottom: 2px solid #334155; }
    h1 { margin: 0; color: #ef4444; font-size: 2.2rem; letter-spacing: 1px; }
    p.subtitle { color: #94a3b8; margin-top: 5px; }

    /* Navigace / Záložky */
    .tabs { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
    .tab-btn { background: #1e293b; color: #94a3b8; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .tab-btn.active, .tab-btn:hover { background: #ef4444; color: #fff; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    section { background: #1e293b; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    h2 { border-bottom: 2px solid #ef4444; padding-bottom: 8px; margin-top: 0; display: inline-block; }

    /* Tabulky */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #94a3b8; font-weight: 600; }
    tr:hover { background: #334155; }

    /* Zápasy */
    .match-card { background: #0f172a; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .team-name { font-weight: bold; font-size: 1.1rem; width: 40%; }
    .team-home { text-align: right; }
    .team-away { text-align: left; }
    .score-badge { background: #ef4444; color: white; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; }

    /* Play-off pavouk */
    .bracket { display: flex; justify-content: space-between; gap: 20px; margin-top: 20px; overflow-x: auto; padding-bottom: 10px; }
    .bracket-column { flex: 1; min-width: 200px; display: flex; flex-direction: column; justify-content: space-around; }
    .bracket-title { text-align: center; font-weight: bold; color: #94a3b8; margin-bottom: 15px; }
    .bracket-match { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 15px; }
    .bracket-team { display: flex; justify-content: space-between; padding: 4px 0; }
    .bracket-team.winner { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BRNO FLOORBALL CUP</h1>
      <p class="subtitle">Oficiální výsledkový servis turnaje</p>
    </header>

    <!-- Přepínání záložek -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('groups')">Základní skupiny</button>
      <button class="tab-btn" onclick="switchTab('stats')">Kanadské bodování</button>
      <button class="tab-btn" onclick="switchTab('playoff')">Play-off Pavouk</button>
    </div>

    <!-- ZÁLOŽKA 1: SKUPINY A ZÁPASY -->
    <div id="tab-groups" class="tab-content active">
      <section>
        <h2>Zápasy</h2>
        <div id="matches-list"></div>
      </section>

      <section>
        <h2>Tabulka Skupiny A</h2>
        <table>
          <thead>
            <tr><th>#</th><th>Tým</th><th>Z</th><th>V</th><th>R</th><th>P</th><th>Skóre</th><th>Body</th></tr>
          </thead>
          <tbody id="standings-body"></tbody>
        </table>
      </section>
    </div>

    <!-- ZÁLOŽKA 2: KANADSKÉ BODOVÁNÍ -->
    <div id="tab-stats" class="tab-content">
      <section>
        <h2>Kanadské bodování turnaje</h2>
        <table>
          <thead>
            <tr><th>#</th><th>Hráč</th><th>Tým</th><th>Góly</th><th>Asistence</th><th>Body</th></tr>
          </thead>
          <tbody id="stats-body"></tbody>
        </table>
      </section>
    </div>

    <!-- ZÁLOŽKA 3: PLAY-OFF PAVOUK -->
    <div id="tab-playoff" class="tab-content">
      <section>
        <h2>Vyřazovací boje</h2>
        <div class="bracket">
          <!-- Semifinále -->
          <div class="bracket-column">
            <div class="bracket-title">Semifinále</div>
            <div class="bracket-match">
              <div class="bracket-team winner"><span>FBK Bulldogs Brno</span> <span>4</span></div>
              <div class="bracket-team"><span>Florbal Židenice</span> <span>2</span></div>
            </div>
            <div class="bracket-match">
              <div class="bracket-team winner"><span>Gullivers Brno</span> <span>3</span></div>
              <div class="bracket-team"><span>Trojans Brno</span> <span>1</span></div>
            </div>
          </div>

          <!-- Finále -->
          <div class="bracket-column">
            <div class="bracket-title">Finále</div>
            <div class="bracket-match" style="border-color: #ef4444;">
              <div class="bracket-team"><span>FBK Bulldogs Brno</span> <span>-</span></div>
              <div class="bracket-team"><span>Gullivers Brno</span> <span>-</span></div>
            </div>
          </div>
        </div>
      </section>
    </div>

  </div>

  <script>
    // Data
    const mockMatches = [
      { home: 'FBK Bulldogs Brno', away: 'Florbal Židenice', homeScore: 5, awayScore: 3 },
      { home: 'Florbal Židenice', away: 'Gullivers Brno', homeScore: 2, awayScore: 2 },
      { home: 'Gullivers Brno', away: 'FBK Bulldogs Brno', homeScore: 1, awayScore: 4 }
    ];

    const mockStandings = [
      { name: 'FBK Bulldogs Brno', played: 2, wins: 2, draws: 0, losses: 0, goalsFor: 9, goalsAgainst: 4, points: 6 },
      { name: 'Gullivers Brno', played: 2, wins: 0, draws: 1, losses: 1, goalsFor: 3, goalsAgainst: 6, points: 1 },
      { name: 'Florbal Židenice', played: 2, wins: 0, draws: 1, losses: 1, goalsFor: 5, goalsAgainst: 7, points: 1 }
    ];

    const mockStats = [
      { name: 'Jan Novák', team: 'FBK Bulldogs Brno', goals: 5, assists: 2, points: 7 },
      { name: 'Petr Svoboda', team: 'Gullivers Brno', goals: 3, assists: 3, points: 6 },
      { name: 'Tomáš Dvořák', team: 'Florbal Židenice', goals: 4, assists: 1, points: 5 },
      { name: 'Martin Kučera', team: 'FBK Bulldogs Brno', goals: 2, assists: 3, points: 5 }
    ];

    // Přepínání záložek
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tabName}`).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Vykreslení dat
    function render() {
      // Zápasy
      document.getElementById('matches-list').innerHTML = mockMatches.map(m => `
        <div class="match-card">
          <div class="team-name team-home">${m.home}</div>
          <div class="score-badge">${m.homeScore} : ${m.awayScore}</div>
          <div class="team-name team-away">${m.away}</div>
        </div>
      `).join('');

      // Tabulka
      document.getElementById('standings-body').innerHTML = mockStandings.map((t, i) => `
        <tr>
          <td><strong>${i + 1}.</strong></td>
          <td>${t.name}</td>
          <td>${t.played}</td>
          <td>${t.wins}</td>
          <td>${t.draws}</td>
          <td>${t.losses}</td>
          <td>${t.goalsFor}:${t.goalsAgainst}</td>
          <td><strong>${t.points}</strong></td>
        </tr>
      `).join('');

      // Statistiky
      document.getElementById('stats-body').innerHTML = mockStats.map((s, i) => `
        <tr>
          <td><strong>${i + 1}.</strong></td>
          <td>${s.name}</td>
          <td>${s.team}</td>
          <td>${s.goals}</td>
          <td>${s.assists}</td>
          <td><strong>${s.points}</strong></td>
        </tr>
      `).join('');
    }

    render();
  </script>
</body>
</html>

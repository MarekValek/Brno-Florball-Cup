<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brno Floorball Cup (BFC) - Zápasy a Tabulky</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; padding: 20px 0; border-bottom: 2px solid #334155; }
    h1 { margin: 0; color: #ef4444; font-size: 2.2rem; letter-spacing: 1px; }
    p.subtitle { color: #94a3b8; margin-top: 5px; }
    
    section { background: #1e293b; border-radius: 12px; padding: 20px; margin-top: 30px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    h2 { border-bottom: 2px solid #ef4444; padding-bottom: 8px; margin-top: 0; display: inline-block; }

    /* Tabulka */
    table { width: 100%; border-collapse: collapse; margin-top: 15px; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid #334155; }
    th { background: #0f172a; color: #94a3b8; font-weight: 600; }
    tr:hover { background: #334155; }

    /* Zápasy */
    .match-card { background: #0f172a; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .team-name { font-weight: bold; font-size: 1.1rem; width: 40%; }
    .team-home { text-align: right; }
    .team-away { text-align: left; }
    .score-badge { background: #ef4444; color: white; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 1.2rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>BRNO FLOORBALL CUP</h1>
      <p class="subtitle">Oficiální výsledkový servis turnaje</p>
    </header>

    <!-- ROZPIS A VÝSLEDKY -->
    <section>
      <h2>Zápasy</h2>
      <div id="matches-list"></div>
    </section>

    <!-- TABULKA SKUPINY -->
    <section>
      <h2>Tabulka skupiny A</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Tým</th>
            <th>Z</th>
            <th>V</th>
            <th>R</th>
            <th>P</th>
            <th>Skóre</th>
            <th>Body</th>
          </tr>
        </thead>
        <tbody id="standings-body"></tbody>
      </table>
    </section>
  </div>

  <script>
    // Testovací data pro zobrazení na statickém webu
    const mockMatches = [
      { home: 'FBK Bulldogs Brno', away: 'Florbal Židenice', homeScore: 5, awayScore: 3 },
      { home: 'Florbal Židenice', away: 'Gullivers Brno', homeScore: 2, awayScore: 2 },
      { home: 'Gullivers Brno', away: 'FBK Bulldogs Brno', homeScore: 1, awayScore: 4 }
    ];

    const mockStandings = [
      { name: 'FBK Bulldogs Brno', played: 2, wins: 2, draws: 0, losses: 0, goalsFor: 9, goalsAgainst: 4, points: 6 },
      { name: 'Gullivers Brno', played: 2, wins: 0, draws: 1, losses: 1, goalsFor: 3, goalsAgainst: 6, points: 1 },
      { name: 'Florbal Židenice', played: 2, wins: 0, draws: 1, losses: 1, goalsFor: 5, goalsAgainst: 7, points: 1 }
    ];

    function renderMatches() {
      const container = document.getElementById('matches-list');
      container.innerHTML = mockMatches.map(m => `
        <div class="match-card">
          <div class="team-name team-home">${m.home}</div>
          <div class="score-badge">${m.homeScore} : ${m.awayScore}</div>
          <div class="team-name team-away">${m.away}</div>
        </div>
      `).join('');
    }

    function renderStandings() {
      const tbody = document.getElementById('standings-body');
      tbody.innerHTML = mockStandings.map((team, index) => `
        <tr>
          <td><strong>${index + 1}.</strong></td>
          <td>${team.name}</td>
          <td>${team.played}</td>
          <td>${team.wins}</td>
          <td>${team.draws}</td>
          <td>${team.losses}</td>
          <td>${team.goalsFor}:${team.goalsAgainst}</td>
          <td><strong>${team.points}</strong></td>
        </tr>
      `).join('');
    }

    renderMatches();
    renderStandings();
  </script>
</body>
</html>

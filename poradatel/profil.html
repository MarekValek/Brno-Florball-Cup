<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pořadatel - Profil | BFC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bfcRed: '#E31B23', bfcDark: '#121316', bfcCard: '#1C1E22', bfcBorder: '#2E3238' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bfcDark text-gray-100 min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 bg-bfcDark/95 border-b border-bfcBorder">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="../index.html" class="text-xl font-black text-white">BFC <span class="text-bfcRed">Pořadatel</span></a>
            <nav class="space-x-2 text-sm font-semibold">
                <a href="profil.html" class="px-3 py-2 bg-bfcRed text-white rounded-lg">Můj profil</a>
                <a href="zapis.html" class="px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Zápis o utkání</a>
                <a href="../index.html" class="px-3 py-2 text-gray-400">Hlavní web</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-6">
        <div class="bg-bfcCard border border-bfcBorder rounded-2xl p-6 md:p-8 max-w-xl space-y-4">
            <h1 class="text-2xl font-black text-white">Profil pořadatele (Pořadatel 1)</h1>
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block text-xs font-bold text-gray-400">Jméno a Příjmení</label>
                    <input type="text" value="Marek Váleček" class="w-full mt-1 bg-bfcDark border border-bfcBorder rounded-xl px-4 py-2.5 text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400">Pozice</label>
                    <input type="text" value="Hlavní rozhodčí / Časoměřič" class="w-full mt-1 bg-bfcDark border border-bfcBorder rounded-xl px-4 py-2.5 text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400">Číslo účtu</label>
                    <input type="text" value="123456789/0300" class="w-full mt-1 bg-bfcDark border border-bfcBorder rounded-xl px-4 py-2.5 text-white">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400">Velikost trička</label>
                    <select class="w-full mt-1 bg-bfcDark border border-bfcBorder rounded-xl px-4 py-2.5 text-white">
                        <option>S</option><option>M</option><option selected>L</option><option>XL</option><option>XXL</option>
                    </select>
                </div>
                <button onclick="alert('Profil úspěšně uložen!')" class="w-full py-3 bg-bfcRed text-white font-bold rounded-xl hover:bg-red-700 transition">Uložit profil</button>
            </div>
        </div>
    </main>
    <footer class="border-t border-bfcBorder py-6 text-center text-xs text-gray-500">&copy; 2026 Brno Florball Cup</footer>
    <script>lucide.createIcons();</script>
</body>
</html>

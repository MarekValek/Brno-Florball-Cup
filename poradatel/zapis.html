<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zápis o utkání - Pořadatel | BFC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bfcRed: '#E31B23', bfcDark: '#121316', bfcCard: '#1C1E22', bfcBorder: '#2E3238' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bfcDark text-gray-100 min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 bg-bfcDark/95 border-b border-bfcBorder">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="../index.html" class="text-xl font-black text-white">BFC <span class="text-bfcRed">Zápis</span></a>
            <nav class="space-x-2 text-sm font-semibold">
                <a href="profil.html" class="px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Můj profil</a>
                <a href="zapis.html" class="px-3 py-2 bg-bfcRed text-white rounded-lg">Zápis o utkání</a>
                <a href="../index.html" class="px-3 py-2 text-gray-400">Hlavní web</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-6">
        <h1 class="text-3xl font-black text-white">Zápis o utkání & Živé ovládání (Pořadatel 2)</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Časomíra a periody -->
            <div class="bg-bfcCard border border-bfcBorder p-6 rounded-2xl space-y-4">
                <h3 class="font-bold text-white border-b border-bfcBorder pb-2">Časomíra</h3>
                <div class="text-center bg-bfcDark p-4 rounded-xl border border-bfcBorder">
                    <div id="timer" class="text-4xl font-black text-emerald-400">08:00</div>
                    <span class="text-xs text-gray-400">Délka: <input type="number" id="timer-length" value="8" class="w-10 bg-bfcCard text-center text-white border border-bfcBorder rounded"> min</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="toggleTimer()" id="timer-btn" class="py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg">Spustit</button>
                    <button onclick="resetTimer()" class="py-2 bg-bfcCardHover border border-bfcBorder text-xs font-bold rounded-lg">Reset</button>
                </div>
                <button onclick="alert('Time Out 1 minuta spuštěn!')" class="w-full py-2 bg-amber-600 text-white text-xs font-bold rounded-lg">Time Out</button>
            </div>

            <!-- Skóre, vlastní góly, tresty a nájezdy -->
            <div class="bg-bfcCard border border-bfcBorder p-6 rounded-2xl space-y-4 lg:col-span-2">
                <h3 class="font-bold text-white border-b border-bfcBorder pb-2">Události v zápase</h3>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-bfcDark p-4 rounded-xl border border-bfcBorder space-y-2">
                        <span class="text-xs font-bold text-bfcRed">DOMÁCÍ</span>
                        <div class="text-3xl font-black text-white" id="score-h">3</div>
                        <div class="space-x-1">
                            <button onclick="scoreChange('h', 1)" class="px-3 py-1 bg-bfcRed text-white text-xs font-bold rounded">+Gól</button>
                            <button onclick="scoreChange('h', -1)" class="px-2 py-1 bg-bfcCardHover text-xs rounded">-</button>
                        </div>
                        <label class="flex items-center space-x-1 text-xs text-amber-400 pt-2"><input type="checkbox" id="h-og"> Vlastní gól</label>
                    </div>

                    <div class="bg-bfcDark p-4 rounded-xl border border-bfcBorder space-y-2">
                        <span class="text-xs font-bold text-blue-400">HOSTÉ</span>
                        <div class="text-3xl font-black text-white" id="score-a">2</div>
                        <div class="space-x-1">
                            <button onclick="scoreChange('a', 1)" class="px-3 py-1 bg-blue-600 text-white text-xs font-bold rounded">+Gól</button>
                            <button onclick="scoreChange('a', -1)" class="px-2 py-1 bg-bfcCardHover text-xs rounded">-</button>
                        </div>
                        <label class="flex items-center space-x-1 text-xs text-amber-400 pt-2"><input type="checkbox" id="a-og"> Vlastní gól</label>
                    </div>
                </div>

                <!-- Tresty -->
                <div class="bg-bfcDark p-3 rounded-xl border border-bfcBorder flex items-center space-x-2">
                    <select id="pen-type" class="bg-bfcCard border border-bfcBorder rounded px-2 py-1.5 text-xs text-white">
                        <option>2 min - Nedovolená hra</option>
                        <option>2 min - Sekání</option>
                        <option>5 min - Nesportovní chování</option>
                    </select>
                    <button onclick="addLog('Vyloučení: ' + document.getElementById('pen-type').value)" class="px-3 py-1.5 bg-bfcRed text-white text-xs font-bold rounded">Přidat trest</button>
                </div>

                <!-- Nájezdy -->
                <div class="bg-bfcDark p-3 rounded-xl border border-bfcBorder flex space-x-2">
                    <button onclick="addLog('Nájezd po konci: DAL (&check;)')" class="px-3 py-1 bg-emerald-600 text-white text-xs font-bold rounded">Nájezd: DAL</button>
                    <button onclick="addLog('Nájezd po konci: NEDAL (&times;)')" class="px-3 py-1 bg-red-600 text-white text-xs font-bold rounded">Nájezd: NEDAL</button>
                </div>

                <!-- Logy -->
                <div class="space-y-1">
                    <span class="text-xs font-bold text-gray-400">Logy ze zápasu:</span>
                    <div id="logs" class="bg-bfcDark border border-bfcBorder rounded-xl p-3 h-28 overflow-y-auto text-xs text-gray-300">
                        <div class="italic text-gray-500">Zatím žádné události...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-bfcBorder py-6 text-center text-xs text-gray-500">&copy; 2026 Brno Florball Cup</footer>
    <script>
        let tSec = 480, tRun = false, tInt = null;
        function toggleTimer() {
            tRun = !tRun;
            document.getElementById('timer-btn').textContent = tRun ? "Pauza" : "Spustit";
            document.getElementById('timer-btn').className = tRun ? "py-2 bg-amber-600 text-white text-xs font-bold rounded-lg" : "py-2 bg-emerald-600 text-white text-xs font-bold rounded-lg";
            if(tRun) {
                tInt = setInterval(() => { if(tSec > 0) { tSec--; updateDisplay(); } }, 1000);
            } else { clearInterval(tInt); }
        }
        function resetTimer() {
            tRun = false; clearInterval(tInt);
            tSec = parseInt(document.getElementById('timer-length').value || 8) * 60;
            updateDisplay();
            document.getElementById('timer-btn').textContent = "Spustit";
        }
        function updateDisplay() {
            let m = String(Math.floor(tSec/60)).padStart(2,'0');
            let s = String(tSec%60).padStart(2,'0');
            document.getElementById('timer').textContent = `${m}:${s}`;
        }
        function scoreChange(team, delta) {
            let el = document.getElementById(`score-${team}`);
            let val = Math.max(0, parseInt(el.textContent) + delta);
            el.textContent = val;
            if(delta > 0) {
                let og = document.getElementById(`${team}-og`).checked ? " (Vlastní gól!)" : "";
                addLog(`Gól pro ${team === 'h' ? 'Domácí' : 'Hosty'}${og}! Skóre: ${document.getElementById('score-h').textContent}:${document.getElementById('score-a').textContent}`);
                document.getElementById(`${team}-og`).checked = false;
            }
        }
        function addLog(text) {
            let c = document.getElementById('logs');
            if(c.querySelector('.italic')) c.innerHTML = '';
            let div = document.createElement('div');
            div.innerHTML = `<span class="text-bfcRed font-bold">[${document.getElementById('timer').textContent}]</span> ${text}`;
            c.prepend(div);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pořádání turnaje | Brno Florball Cup</title>
    <link rel="icon" type="image/png" href="../images/BFC/BFC-Logo2.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bfcRed: '#E31B23', bfcDark: '#121316', bfcCard: '#1C1E22', bfcBorder: '#2E3238' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bfcDark text-gray-100 min-h-screen flex font-sans antialiased">

    <!-- Levý Postranní Panel (Sidebar) -->
    <aside class="w-64 bg-bfcCard border-r border-bfcBorder flex flex-col flex-shrink-0">
        <div class="p-6 border-b border-bfcBorder flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-bfcRed/10 border border-bfcRed/30 flex items-center justify-center font-black text-bfcRed text-sm">BFC</div>
            <div>
                <span class="block text-xs font-bold uppercase tracking-wider text-gray-400">Brno Florball</span>
                <span class="font-black text-white tracking-tight">Administrace</span>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-1.5 text-sm font-semibold">
            <a href="rozcestnik.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-400 hover:bg-bfcDark hover:text-white transition">
                <i data-lucide="layout-grid" class="w-4 h-4"></i>
                <span>Rozcestník</span>
            </a>
            <a href="turnaje.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-gray-400 hover:bg-bfcDark hover:text-white transition">
                <i data-lucide="trophy" class="w-4 h-4"></i>
                <span>Turnaje</span>
            </a>
            <a href="poradani.html" class="flex items-center space-x-3 px-3.5 py-2.5 rounded-xl bg-bfcRed text-white font-bold transition shadow-lg shadow-bfcRed/20">
                <i data-lucide="radio" class="w-4 h-4"></i>
                <span>Pořádání turnaje</span>
            </a>
        </nav>

        <div class="p-4 border-t border-bfcBorder">
            <a href="../index.html" class="flex items-center space-x-2 text-xs text-gray-400 hover:text-bfcRed transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Zpět na hlavní web</span>
            </a>
        </div>
    </aside>

    <!-- Hlavní Obsahová Část -->
    <main class="flex-1 overflow-y-auto p-8 md:p-12">
        <div class="max-w-6xl mx-auto space-y-6">
            <div>
                <span class="text-xs font-bold uppercase tracking-wider text-bfcRed bg-bfcRed/10 px-3 py-1 rounded-full border border-bfcRed/30">Pořádání turnaje</span>
                <h1 class="text-2xl md:text-3xl font-black uppercase tracking-wider text-white mt-2">Výběr aktivního turnaje</h1>
                <p class="text-xs text-gray-400 mt-1">Vyberte turnaj, ve kterém chcete spravovat zápasy, výsledky a časomíru.</p>
            </div>

            <!-- Grid karet turnajů -->
            <div id="poradani-cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pt-4">
                <!-- Generuje se dynamicky skriptem -->
            </div>
        </div>
    </main>

    <script>
        const turnajeData = [
            { id: "mladsi-elevove", name: "Challenge Cup – Mladší elévové 3+1", datum: "5. 9. 2026", odehrano: "20 z 20 zápasů odehráno" },
            { id: "starsi-elevove", name: "Challenge Cup – Starší elévové 3+1", datum: "6. 9. 2026", odehrano: "30 z 30 zápasů odehráno" },
            { id: "mladsi-zaci", name: "Challenge Cup – Mladší žáci 5+1", datum: "12. 9. 2026", odehrano: "19 z 19 zápasů odehráno" },
            { id: "starsi-zaci", name: "Challenge Cup – Starší žáci 5+1", datum: "13. 9. 2026", odehrano: "18 z 18 zápasů odehráno" }
        ];

        const grid = document.getElementById('poradani-cards-grid');
        grid.innerHTML = "";

        turnajeData.forEach((t, i) => {
            grid.innerHTML += `
                <div class="bg-bfcCard border border-bfcBorder rounded-2xl p-6 shadow-xl flex flex-col justify-between space-y-6 hover:border-bfcRed/40 transition duration-300">
                    <div class="space-y-3">
                        <span class="text-[10px] font-black uppercase tracking-wider text-bfcRed bg-bfcRed/10 px-2.5 py-0.5 rounded border border-bfcRed/20">#${i + 2}</span>
                        <h3 class="font-black text-lg text-white">${t.name}</h3>
                        
                        <div class="space-y-1.5 text-xs text-gray-400 pt-2 border-t border-bfcBorder">
                            <p class="flex items-center space-x-2"><i data-lucide="calendar" class="w-3.5 h-3.5 text-bfcRed"></i><span>${t.datum}</span></p>
                            <p class="flex items-center space-x-2"><i data-lucide="swords" class="w-3.5 h-3.5 text-bfcRed"></i><span>${t.odehrano}</span></p>
                        </div>
                    </div>

                    <a href="poradani-detail.html?id=${t.id}" class="w-full py-3 bg-bfcDark hover:bg-bfcRed text-white font-bold rounded-xl transition text-xs border border-bfcBorder hover:border-bfcRed flex items-center justify-center space-x-2 shadow-lg">
                        <span>VSTOUPIT DO TURNAJE</span>
                        <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </a>
                </div>
            `;
        });

        lucide.createIcons();
    </script>
</body>
</html>

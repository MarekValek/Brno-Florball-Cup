<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haly - BFC Brno Florball Cup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bfcRed: '#E31B23', bfcDark: '#121316', bfcCard: '#1C1E22', bfcBorder: '#2E3238' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bfcDark text-gray-100 min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 bg-bfcDark/95 border-b border-bfcBorder">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black text-white">BFC <span class="text-bfcRed">Haly</span></a>
            <nav class="space-x-2 text-sm font-semibold">
                <a href="index.html" class="px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Hlavní web</a>
                <a href="haly.html" class="px-3 py-2 bg-bfcRed text-white rounded-lg">Haly</a>
                <a href="rozpisy.html" class="px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Rozpisy</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-6">
        <h1 class="text-3xl font-black text-white">Hrací haly</h1>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-bfcCard border border-bfcBorder p-6 rounded-2xl space-y-2">
                <h3 class="text-xl font-bold text-white">SH Moravany u Brna</h3>
                <p class="text-xs text-bfcRed font-bold">Hřiště 1 a Hřiště 2</p>
                <p class="text-sm text-gray-300">Hlavní centrální hala turnaje s plným zázemím pro týmy a online časomírou.</p>
            </div>
            <div class="bg-bfcCard border border-bfcBorder p-6 rounded-2xl space-y-2">
                <h3 class="text-xl font-bold text-white">SH Rosice</h3>
                <p class="text-xs text-bfcRed font-bold">Hřiště 3</p>
                <p class="text-sm text-gray-300">Doplňková hrací hala pro mladší věkové kategorie.</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-bfcBorder py-6 text-center text-xs text-gray-500">&copy; 2026 Brno Florball Cup</footer>
    <script>lucide.createIcons();</script>
</body>
</html>

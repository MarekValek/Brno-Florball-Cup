<!DOCTYPE html>
<html lang="cs" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - BFC Brno Florball Cup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { bfcRed: '#E31B23', bfcDark: '#121316', bfcCard: '#1C1E22', bfcBorder: '#2E3238' } } } }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-bfcDark text-gray-100 min-h-screen flex flex-col">
    <header class="sticky top-0 z-50 bg-bfcDark/95 border-b border-bfcBorder">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <a href="index.html" class="text-xl font-black text-white">BFC <span class="text-bfcRed">Kontakt</span></a>
            <nav class="space-x-2 text-sm font-semibold">
                <a href="index.html" class="px-3 py-2 text-gray-300 hover:bg-bfcCard rounded-lg">Hlavní web</a>
                <a href="kontakt.html" class="px-3 py-2 bg-bfcRed text-white rounded-lg">Kontakt</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full space-y-6">
        <h1 class="text-3xl font-black text-white">Kontaktní informace</h1>
        <div class="bg-bfcCard border border-bfcBorder p-6 md:p-8 rounded-2xl max-w-xl space-y-4 text-sm text-gray-300">
            <p><strong class="text-white block text-base mb-1">Brno Florball Cup z.s.</strong></p>
            <p class="flex items-center space-x-2"><i data-lucide="mail" class="w-4 h-4 text-bfcRed"></i> <span>Email: info@brnoflorballcup.cz</span></p>
            <p class="flex items-center space-x-2"><i data-lucide="phone" class="w-4 h-4 text-bfcRed"></i> <span>Telefon: +420 777 888 999</span></p>
            <p class="flex items-center space-x-2"><i data-lucide="map-pin" class="w-4 h-4 text-bfcRed"></i> <span>Sídlo: Brno, Česká republika</span></p>
        </div>
    </main>

    <footer class="border-t border-bfcBorder py-6 text-center text-xs text-gray-500">&copy; 2026 Brno Florball Cup</footer>
    <script>lucide.createIcons();</script>
</body>
</html>
